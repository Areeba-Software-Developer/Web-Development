<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form Website</title>
</head>
<h1>Student Registration Form</h1>
<br>First Name:
<label>
    <input type="text" name="firstname" placeholder = "Enter First Name" required>
</label>
<br>Last Name:
<label>
    <input type = "text" name="firstname" placeholder = "Enter Last Name" required>
</label>
<br>Email:
<label>
    <input type="email" name="email" placeholder = "Enter Email" required>
</label>
<br>Phone No:
<label>
    <input type="number" name="phone" placeholder = "Enter Phone No" required>
</label>
<br>Date of Birth:
<label>
    <input type="date" name="date of birth" placeholder = "Enter Date of Birth" required>
</label>
<br>Gender:
<label>
    <input type="radio" name="gender" value="Male">Male
</label>
<label>
    <input type="radio" name="gender" value="Female">Female
</label>
<label>
    <input type="radio" name="gender" value="Other">Other
</label>
<br>Department:
<label>
    <input type="text" name="department" placeholder = "Enter Department" required>
</label>
<br>Hobbies:
<label>
    <input type="checkbox" name="hobbies" value="Music">Music
</label>
<label>
    <input type="checkbox" name="hobbies" value="Video">Video
</label>
<label>
    <input type="checkbox" name="hobbies" value="Photography">Photography
</label>
<br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</html>
