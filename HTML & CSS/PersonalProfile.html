<html lang="en">

<body>
<div class="container" >

<h1>Personal Profile Card</h1>

<img src="WhatsApp Image 2026-06-24 at 9.33.00 PM.jpeg" alt="Profile Picture" width="150" height="160">
</div>
<br>
<br><b>Full Name:</b>
</br>
<label>
    <input type="text" placeholder="Enter Full Name" name="fullname" required>
</label>

<br>

</br>
<label>
    <input type="date" placeholder="Enter your Date of Birth">
</label>

<br>

<label for="gender"></label><select id="gender" name="gender">

</select>

<br>
<br><b>Address:</b>
</br>
<label>
    <textarea placeholder="Enter your address"></textarea>
</label>

<br>
<br><b>Contact Number:</b>
</br>
<label>
    <input type="number" placeholder="Enter your phone number">
</label>

<br>

</label>

<br>

</br>
<label>
    <input type="text" placeholder="Enter your degree">
</label>

<br>

<label>
    <input type="checkbox" name="skills" value="HTML">HTML
</label>

<label>
    <input type="checkbox" name="skills" value="CSS">CSS

<input type="submit" value="Submit">
